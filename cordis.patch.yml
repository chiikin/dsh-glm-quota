# ============================================================================
# dsh-glm-quota 的 bundle patch —— 把 GLM 配额插件挂进 DSH 配置树
# ============================================================================
#
# insert：往配置树里添加一个插件行（entry）。
#   - id: glm-quota        插件行 id（唯一，patch 覆盖时按它定位）
#   - name: dsh-glm-quota  模块名：解析到本包 lib/index.js（宿主半侧）
# 因为 package.json 声明了 dsh.client，DSH 模块系统同时会把本包扫描为
# "浏览器插件"，提供 /plugins/dsh-glm-quota/client.js 给页面。
#
# ============================================================================

- insert:
    - id: glm-quota
      name: 'dsh-glm-quota'
